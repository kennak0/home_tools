<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>家族の予定表</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="予定表">
  <meta name="color-scheme" content="light dark">
  <!-- standalone 判定はパース中に済ませる。後で付けるとブラウザ用の chrome が一瞬出る -->
  <script>
    if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) {
      document.documentElement.dataset.standalone = "true";
    }
  </script>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main id="app" class="screen">
    <!-- ログイン画面。login.js が unlocked を見て出し分ける -->
    <section id="login" class="pane" hidden>
      <h1>家族の予定表</h1>
      <p class="lead">家族の合言葉を入れてください。この端末では 1 回だけ聞きます。</p>
      <form id="login-form" autocomplete="off">
        <label for="passphrase">合言葉</label>
        <input id="passphrase" name="passphrase" type="password" required
               autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
               inputmode="latin" placeholder="xxxxx-xxxxx-xxxxx-xxxxx">
        <button id="login-submit" type="submit">入る</button>
        <p id="login-error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <!-- ホーム。保存済みの予定一覧と、読み取りへの入口 -->
    <section id="home" class="pane" hidden>
      <header class="bar">
        <h1>家族の予定表</h1>
        <button id="open-settings" type="button" class="link">設定</button>
      </header>
      <!-- 写真は input[type=file] で撮影 or 選択。change で ocr.js を dynamic import する -->
      <label class="file-button">
        <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>
        写真から予定を読み取る
      </label>
      <button id="open-text" type="button" class="secondary">テキストを貼り付けて読み取る</button>
      <h2>予定</h2>
      <ul id="event-list" class="events"></ul>
      <p id="event-empty" class="hint">まだ予定がありません。</p>
    </section>

    <!-- 読み取り: （写真 → OCR →）テキスト → 解析 → 候補の確認 → 追加。通信なし -->
    <section id="import" class="pane" hidden>
      <header class="bar">
        <h1 id="import-title">読み取る</h1>
        <button id="import-cancel" type="button" class="link">やめる</button>
      </header>
      <img id="import-preview" alt="選んだ写真" hidden>
      <p id="import-status" class="hint" hidden></p>
      <progress id="import-progress" max="1" value="0" hidden></progress>
      <p id="import-error" class="error" role="alert" hidden></p>
      <label for="import-text">テキスト（1 行に 1 つの予定。日付と時刻を含める）</label>
      <textarea id="import-text" rows="8" placeholder="10/3（金） 遠足 9:00 集合&#10;10/10（金） 授業参観 13:30〜14:15"></textarea>
      <button id="import-run" type="button">予定を読み取る</button>
      <div id="candidates" hidden>
        <h2>読み取った予定</h2>
        <p class="hint">内容を直して、追加するものにチェックを付けてください。</p>
        <ul id="candidate-list" class="candidates"></ul>
        <details id="unparsed-box" hidden>
          <summary>読めなかった行</summary>
          <ul id="unparsed-list" class="unparsed"></ul>
        </details>
        <button id="import-save" type="button">チェックした予定を追加</button>
      </div>
    </section>

    <!-- 設定 -->
    <section id="settings" class="pane" hidden>
      <header class="bar">
        <h1>設定</h1>
        <button id="settings-close" type="button" class="link">戻る</button>
      </header>
      <h2>この端末</h2>
      <p class="hint">予定はこの端末の中にだけ保存されています。写真もテキストも外部には送りません。</p>
      <button id="logout" type="button" class="secondary">ログアウト（この端末の設定を消す）</button>
    </section>

    <section id="boot" class="pane">
      <p class="lead">読み込み中…</p>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
